site_name: 经济时间序列
site_description: 中国农业大学经济时间序列课程讲义
site_author: 胡哲鹏
site_url: https://zhepenghucau.github.io/Time-seriese-analysis-China-Agricultural-University/

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.integrate
    - search.highlight
    - search.suggest
  palette:
    - scheme: default
      primary: indigo
      accent: blue

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

nav:
  - 课程首页: index.md
  - 绪论 为什么学习时间序列: 第0章_绪论/index.md
  - 第1章 时间序列数据: 第1章_差分方程/index.md
  - 第2章 平稳时间序列模型: 第2章_平稳时间序列模型/index.md
  - 第3章 ARCH与GARCH模型: 第3章_ARCH与GARCH模型/index.md
  - 第4章 非平稳时间序列模型: 第4章_非平稳时间序列模型/index.md
  - 第5章 多变量时间序列模型: 第5章_多变量时间序列模型/index.md
  - 第6章 协整与误差修正模型: 第6章_协整与误差修正模型/index.md

extra_css:
  - 样式/课堂阅读.css

extra_javascript:
  - 脚本/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
